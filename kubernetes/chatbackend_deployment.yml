apiVersion: apps/v1
kind: Deployment
metadata:
  name: Backend_deployment
  namespace: chatbot
  labels:
    app: bk
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bk
  template:
    metadata:
    namespace: chatbot
      labels:
        app: bk
    spec:
      containers:
        - name: backend
          image: siddhantkudal/chatbot_backend:1
          ports:
            - containerPort: 80
          env:
            - name: MONGODB_URI
              value: mongodb://root:root@mongodb:27017/chatApp?authSource=admin
            - name: PORT
              value: 5001
            - name: NODE_ENV
              value: production
            - name: JWT_SECRET
              value: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9..YTeR6zLCKuOPjz5CYfwxW1gXp_wP1gAnN3qSMJIFQFg          
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"

    
        
        

           
  